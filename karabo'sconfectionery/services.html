<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services &amp; Prices | Karabo's Confectionery</title>
    <meta name="description" content="Browse cakes, 
    cupcakes, muffins, biscuits and scones with starting prices. 
    Every order can be customised in flavour, size and design.">
    <meta name="keywords" content="bakery prices, 
    custom cakes, 
    cupcakes, 
    muffins, 
    biscuits, 
    scones, 
    Polokwane bakery menu">
    <meta name="author" content="Karabo's Confectionery">
    <link rel="stylesheet" href="css_assets/myfirststyles.css">
</head>

<body>

    <!-- ===== Site header and main navigation ===== -->
    <header>
        <a href="index.html" class="logo"></a>
            <img src="_images/karabos-confectionery-logo.png" alt="Karabo's Confectionery">
    <nav>
        <ul>
            <li><a href="index.html"> Home</a></li>
            <li><a href="about.html"> About</a></li>
            <li><a href="contact.html"> Contact</a></li>
            <li><a href="services.html" class="active"> Services</a></li>
            <li><a href="enquiries.html"> Enquiries</a></li>
        </ul>
    </nav>

    </header>

<main>
    <h1>Our services</h1>
        <p>
            Every item below can be customised in flavour, size, and design.
            Prices are a starting guide &mdash; final pricing depends on size,
            complexity, and design details.
        </p>

        <!-- Search, filter and sort controls (handled by js_assets/services.js) -->
        <div class="filter-bar" role="search">
            <div class="filter-field">
                <label for="product-search">Search</label>
                <input type="search" id="product-search" placeholder="e.g. muffins, ginger, cake" autocomplete="off">
            </div>
            <div class="filter-field">
                <label for="category-filter">Category</label>
                <select id="category-filter">
                    <option value="all">All treats</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="sort-order">Sort by</label>
                <select id="sort-order">
                    <option value="default">Our order</option>
                    <option value="name">Name (A&ndash;Z)</option>
                    <option value="price-low">Price (low to high)</option>
                    <option value="price-high">Price (high to low)</option>
                </select>
            </div>
        </div>

        <p id="result-count" class="result-count" aria-live="polite"></p>

        <!-- Product cards are built here by JavaScript -->
        <div id="product-list" class="service-grid"></div>

        <noscript>
            <p>Please turn on JavaScript to see our products, or <a href="contact.html">contact us</a> for our full price list.</p>
        </noscript>

</main>

<footer>
     <p>&copy; 2026 Karabo's Confectionery. All rights reserved.</p>
        <p><a href="contact.html">Contact us</a></p>

</footer>

<script src="js_assets/main.js" defer></script>
</body>
</html>
